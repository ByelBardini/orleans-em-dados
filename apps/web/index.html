<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O servidor troca o bloco abaixo pelo head da página pedida (apps/api/src/site/head.ts). -->
    <!--head:inicio-->
    <title>Orleans em Dados · Dados públicos de Orleans/SC</title>
    <meta
      name="description"
      content="Receitas, despesas, educação e a cidade de Orleans/SC em dados públicos, cada número com fonte, ano e conferência entre as fontes."
    />
    <!--head:fim-->
    <meta name="theme-color" content="#efeadf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema escolhido antes da primeira pintura, sem piscar.
      try {
        const tema = localStorage.getItem('tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
