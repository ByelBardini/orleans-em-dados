<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O servidor troca o bloco abaixo pelo head da página pedida (apps/api/src/site/head.ts). -->
    <!--head:inicio-->
    <title>Orleans em Dados · Dados públicos de Orleans/SC</title>
    <meta
      name="description"
      content="Receitas, despesas, educação e a cidade de Orleans/SC em dados públicos, cada número com fonte, ano e conferência entre as fontes."
    />
    <!--head:fim-->
    <meta name="theme-color" content="#efeadf" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- As duas fontes do primeiro texto que aparece; as outras chegam pelo @font-face de styles.css. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-variavel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Aplica o tema escolhido antes da primeira pintura, sem piscar.
      try {
        const tema = localStorage.getItem('tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
